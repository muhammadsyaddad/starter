name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS / TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Only the JS workspaces: the Python packages have their own job and no
      # uv is installed here.
      - run: bunx turbo run lint check-types build --filter=web --filter=dashboard --filter=@repo/ui

  python:
    name: Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [apps/api, packages/pipeline]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock

      - run: uv sync --locked

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest -q

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pelintir
          POSTGRES_PASSWORD: pelintir
          POSTGRES_DB: pelintir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pelintir -d pelintir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pelintir:pelintir@localhost:5432/pelintir
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --locked

      - run: uv run python migrations/apply.py

      # Running twice must be a no-op; a migration that is not idempotent breaks
      # every deploy after the first.
      - run: uv run python migrations/apply.py --status
